<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Styles/Log-Reg.css" />
    <title>Iniciar Sesión</title>
  </head>
  <body>
    <section class="container-log">
      <div class="form-log">
        <div class="img-top">
          <img
            src="../assets/fondoN.jpeg"
            alt="Fondo decorativo"
            class="fondo"
          />
        </div>

        <div class="civa-center">
          <img
            src="../assets/Eltiempo.png"
            alt="Logo de la empresa"
            class="logo"
          />
        </div>

        <div class="form-log-in">
          <form action="index.html" method="post">
            <label for="email">Correo</label>
            <input
              id="email"
              name="email"
              class="input-form"
              type="email"
              placeholder="Correo electrónico"
              required
            />

            <label for="password">Contraseña</label>
            <input
              id="password"
              name="password"
              class="input-form"
              type="password"
              placeholder="Contraseña"
              required
            />

            <button class="btn-form" type="submit">Entrar</button>
          </form>
          <p class="register-text">
            ¿No tienes una cuenta?
            <a href="../Register/index.html">Regístrate</a>
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
