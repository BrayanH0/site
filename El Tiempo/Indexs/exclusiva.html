<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../Styles/exclusiva.css" />
    <script
      src="https://kit.fontawesome.com/ac13462c05.js"
      crossorigin="anonymous"
    ></script>
    <title>Bus Exclusivo</title>
  </head>
  <body>
    <header>
      <div class="logo">
        <img
          src="../assets/LOGO-WEB-sin-fondo-blanco-1024x271.png"
          alt="Logo de la empresa"
        />
      </div>
      <nav class="nav-top">
        <a href="#" class="contact">Contacto</a>
        <select name="language" aria-label="Seleccionar idioma">
          <option value="es">Español</option>
          <option value="en">Inglés</option>
        </select>
      </nav>
    </header>

    <main>
      <section class="present-bus">
        <div class="text-exclusiva">
          <img
            src="../assets/Recurso-1.png"
            alt="Decoración de bus exclusiva"
          />
          <h1>
            Nuestro bus cuenta con dos niveles: en el 1er nivel asientos cama de
            160° y en el 2do nivel asientos full flat 180°. Además, contarás con
            puerto USB para tus dispositivos móviles.
          </h1>
        </div>

        <div class="img-bus">
          <img
            class="fondo-bus"
            src="../assets/Recurso-4-1.png"
            alt="Bus interior exclusivo"
          />
          <img
            class="bus"
            src="../assets/Recurso-3-1.png"
            alt="Imagen del bus exclusivo"
          />
        </div>
      </section>

      <section class="beneficios" aria-label="Beneficios del bus">
        <i class="fa-solid fa-bus-simple" title="Bus cómodo">hola</i>
        <i class="fa-solid fa-tv" title="Pantallas personales"></i>
        <i class="fa-solid fa-location-dot" title="GPS en tiempo real"></i>
        <i class="fa-solid fa-restroom" title="Baño disponible"></i>
        <i class="fa-solid fa-snowflake" title="Aire acondicionado"></i>
        <i
          class="fa-solid fa-gauge-simple-high"
          title="Velocidad controlada"
        ></i>
        <i class="fa-brands fa-usb" title="Puerto USB"></i>
        <i class="fa-solid fa-paw" title="Pet friendly"></i>
      </section>
    </main>

    <footer>
      <div class="social-media">
        <!-- Enlaces a redes sociales -->
      </div>
      <div class="address">
        <!-- Dirección de contacto -->
      </div>
    </footer>
  </body>
</html>
